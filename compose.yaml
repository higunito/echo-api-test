services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_DB: guild
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_DB: guild_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild -d guild_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
